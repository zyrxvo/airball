name: Version Check

on:
  pull_request:
    branches:
      - main

env:
  UV_FROZEN: true
  PYTHON_VERSION: "3.14"

jobs:
  check-version:
    runs-on: ubuntu-slim
    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main
          path: main_branch

      - name: Checkout current branch
        uses: actions/checkout@v4
        with:
          path: current_branch

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Compare versions
        run: |
          uv run --python ${{ env.PYTHON_VERSION }} --with packaging python .github/workflows/scripts/version_check.py
